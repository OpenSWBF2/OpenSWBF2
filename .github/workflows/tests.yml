name: tests

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full-' || '' }}${{ github.ref }}
  cancel-in-progress: false

jobs:
  asan:
    name: asan
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, v143]
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - name: ASan T1, corpus, Standard and Dedicated smoke
        shell: cmd
        run: call tests\gate.cmd -Tier phase -Platform Win32 -Step t1-Asan,standard-Asan,dedicated-Asan,corpus-Asan
      - name: Clean staged output
        if: always()
        shell: cmd
        run: call tests\gate.cmd clean -Config Asan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() || cancelled()
        with:
          name: asan-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  full:
    name: full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, v143]
    timeout-minutes: 7200
    concurrency:
      group: tests-full
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - name: All smoke
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step all-Release
      - name: Perturb smoke
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step perturb-Test
      - name: Test All smoke
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step all-Test-short
      - name: ASan T1
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step t1-Asan
      - name: ASan Standard smoke
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step standard-Asan
      - name: ASan soak
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step soak-Asan
      - name: ASan Dedicated smoke
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step dedicated-Asan
      - name: Hardening source
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step hardening-source
      - name: Hardening Release
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step hardening-binary-Release
      - name: Hardening Test
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step hardening-binary-Test
      - name: Hardening ASan
        if: ${{ !cancelled() }}
        shell: cmd
        run: call tests\gate.cmd -Tier milestone -Platform Win32 -Step hardening-binary-Asan
      - name: Clean staged output
        if: always()
        shell: cmd
        run: call tests\gate.cmd clean
      - name: Clean staged ASan output
        if: always()
        shell: cmd
        run: call tests\gate.cmd clean -Config Asan
      - name: Clean staged Test output
        if: always()
        shell: cmd
        run: call tests\gate.cmd clean -Config Test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() || cancelled()
        with:
          name: full-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
